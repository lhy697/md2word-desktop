[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2word"
version = "1.0.0"
description = "Offline Markdown to editable Word - validated conversion and background export"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.8.3", "python-docx==1.2.0", "pydantic==2.11.9"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0"]

[project.scripts]
md2word = "md2word.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
