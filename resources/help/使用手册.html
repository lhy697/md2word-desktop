<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>使用手册</title><body><h1>Markdown 转 Word 1.0.0</h1><p>导入或粘贴 UTF-8 Markdown/TXT，选择输入模式，调整整篇或局部样式，检查提示后导出新的 DOCX。</p><p>预览不模拟精确分页；当前不嵌入图片。公式不能可靠转换时会提示并保留源码。请在导出后复核字体、表格、公式和分页。</p><p>Ctrl+N 新建；Ctrl+O 导入；Ctrl+E 导出；Ctrl+Enter 刷新；F1 帮助。自动草稿只恢复最近成功保存的快照。</p><p>完整说明见源码仓库 docs/usage.md 与 docs/limitations.md。</p></body></html>
